<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI:ssociate</title>
  <link rel="stylesheet" href="taskpane.css" />
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <h1 class="logo">AI<span class="logo-colon">:</span>ssociate</h1>
      <p class="subtitle">Legal AI Assistant</p>
    </header>

    <!-- Selected text preview -->
    <div id="selection-bar" class="selection-bar">
      <div class="selection-bar-header">
        <span class="selection-label">Selected Text</span>
        <button id="grab-selection-btn" class="icon-btn-sm" title="Refresh selection">&#8635;</button>
      </div>
      <div id="selection-preview" class="selection-preview">
        <p class="placeholder">Highlight text in your document to get started.</p>
      </div>
    </div>

    <!-- Chat area -->
    <div id="chat-container" class="chat-container">
      <div id="chat-messages" class="chat-messages">
        <div class="chat-welcome">
          <p>Select text in Word, then ask a question or request a suggestion.</p>
        </div>
      </div>
    </div>

    <!-- Input area -->
    <div class="input-area">
      <div class="input-row">
        <textarea
          id="question-input"
          rows="2"
          placeholder="Ask about the selected text or request changes..."
        ></textarea>
        <button id="send-btn" class="send-btn" disabled title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="input-hints">
        <select id="legal-area-select" class="hint-select" title="Legal area">
          <option value="">Any area</option>
          <option value="zivilrechtogh">Civil</option>
          <option value="strafrecht">Criminal</option>
          <option value="steuerrecht">Tax</option>
          <option value="publiclaw">Public</option>
        </select>
        <select id="scope-select" class="hint-select" title="Jurisdiction scope">
          <option value="">Any scope</option>
          <option value="Bund">Bund</option>
          <option value="Wien">Wien</option>
          <option value="Steiermark">Steiermark</option>
          <option value="Tirol">Tirol</option>
          <option value="Kärnten">Kaernten</option>
          <option value="Niederösterreich">Niederoesterreich</option>
          <option value="Oberösterreich">Oberoesterreich</option>
          <option value="Vorarlberg">Vorarlberg</option>
          <option value="Burgenland">Burgenland</option>
          <option value="Salzburg">Salzburg</option>
        </select>
      </div>
    </div>

    <!-- Settings toggle (minimal) -->
    <div class="settings-footer">
      <button id="settings-toggle" class="settings-link">Settings</button>
    </div>

    <!-- Settings overlay -->
    <div id="settings-overlay" class="settings-overlay hidden">
      <div class="settings-card">
        <div class="settings-card-header">
          <h2>Settings</h2>
          <button id="settings-close" class="icon-btn-sm">&times;</button>
        </div>
        <label for="api-key-input">API Key</label>
        <div class="key-input-wrapper">
          <input id="api-key-input" type="password" placeholder="ck:..." />
          <button id="toggle-key-vis" class="icon-btn-sm" title="Show/hide">&#128065;</button>
        </div>
        <label for="language-select">Response Language</label>
        <select id="language-select">
          <option value="auto">Auto-detect</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="fr">Francais</option>
        </select>
        <div class="btn-row">
          <button id="save-settings" class="btn btn-primary">Save</button>
        </div>
        <p id="settings-status" class="status-msg hidden"></p>
      </div>
    </div>
  </div>

  <script src="taskpane.js"></script>
</body>
</html>
