<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <script>
  /* global Office, Word */
  var AISSOCIATE_BASE_URL = "https://aissociate.at";
  var AISSOCIATE_ASK_ENDPOINT = "/api/public/v1/chat/ask";
  var DEFAULT_API_KEY = "ck:2a4fb1fc-fdd8-477d-b353-602573944fdb:46a20ebd-abad-4a7d-b1ed-ec4ab8a535ac";

  Office.onReady(function () {
    Office.actions.associate("askAboutSelection", askAboutSelection);
  });

  async function askAboutSelection(event) {
    var apiKey = localStorage.getItem("aissociate_api_key") || DEFAULT_API_KEY;

    try {
      await Word.run(async function (ctx) {
        var sel = ctx.document.getSelection();
        sel.load("text");
        await ctx.sync();
        var text = sel.text.trim();
        if (!text) { event.completed(); return; }

        var body = {
          question: 'Legal text:\n"""\n' + text + '\n"""\n\nProvide a concise legal analysis: key risks, obligations, and notable clauses.',
          law: null,
          sub_law: null,
          file_context: [],
          file_query_type: "general"
        };

        var response = await fetch(AISSOCIATE_BASE_URL + AISSOCIATE_ASK_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-api-key": apiKey },
          body: JSON.stringify(body)
        });
        if (!response.ok) throw new Error("HTTP " + response.status);

        var reader = response.body.getReader();
        var decoder = new TextDecoder();
        var buffer = "";
        var fullResponse = "";

        while (true) {
          var result = await reader.read();
          if (result.done) break;
          buffer += decoder.decode(result.value, { stream: true });
          var lines = buffer.split("\n");
          buffer = lines.pop() || "";

          for (var i = 0; i < lines.length; i++) {
            if (lines[i].startsWith("data: ")) {
              var dataStr = lines[i].slice(6).trim();
              if (dataStr === "[DONE]") continue;
              try {
                var data = JSON.parse(dataStr);
                if (data.type === "message" && data.text) {
                  fullResponse += data.text;
                }
              } catch (e) { /* skip */ }
            }
          }
        }

        if (!fullResponse && buffer) {
          try {
            var d = JSON.parse(buffer);
            fullResponse = d.text || buffer;
          } catch (e) { fullResponse = buffer; }
        }

        if (fullResponse && sel.insertComment) {
          sel.insertComment("[AI:ssociate] " + fullResponse);
          await ctx.sync();
        }
        event.completed();
      });
    } catch (e) { event.completed(); }
  }
  </script>
</head>
<body></body>
</html>
