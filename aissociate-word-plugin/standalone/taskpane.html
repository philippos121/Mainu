<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI:ssociate</title>
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <style>
    :root {
      --primary: #1a3a5c; --primary-light: #2a5a8c; --accent: #d4a843;
      --bg: #f7f8fa; --surface: #ffffff; --text: #1e1e1e; --text-muted: #6b7280;
      --border: #e0e3e8; --success: #16a34a; --error: #dc2626; --dismissed: #9ca3af;
      --user-bubble: #1a3a5c; --user-text: #ffffff; --ai-bubble: #ffffff; --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: "Segoe UI", -apple-system, sans-serif; font-size: 13px; color: var(--text); background: var(--bg); line-height: 1.5; }
    #app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .header { text-align: center; padding: 10px 16px 6px; background: var(--primary); color: #fff; flex-shrink: 0; }
    .logo { font-size: 20px; font-weight: 700; color: #fff; }
    .logo-colon { color: var(--accent); }
    .subtitle { font-size: 10px; color: rgba(255,255,255,.7); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 1px; }
    .selection-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 12px; flex-shrink: 0; }
    .selection-bar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .selection-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); }
    .selection-preview { max-height: 60px; overflow-y: auto; font-size: 11px; background: var(--bg); border: 1px dashed var(--border); border-radius: 6px; padding: 6px 8px; }
    .selection-preview .placeholder { color: var(--text-muted); font-style: italic; text-align: center; font-size: 11px; }
    .selected-text { white-space: pre-wrap; word-break: break-word; }
    .chat-container { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .chat-welcome { text-align: center; padding: 30px 16px; color: var(--text-muted); font-size: 12px; font-style: italic; }
    .msg { display: flex; max-width: 90%; }
    .msg-user { align-self: flex-end; }
    .msg-assistant { align-self: flex-start; }
    .msg-content { border-radius: 12px; padding: 10px 14px; font-size: 12px; line-height: 1.6; word-break: break-word; }
    .msg-user .msg-content { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
    .msg-assistant .msg-content { background: var(--ai-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg-error .msg-content { border-color: var(--error); background: #fef2f2; }
    .msg-label { font-size: 10px; font-weight: 700; color: var(--primary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .3px; }
    .msg-text { white-space: pre-wrap; min-height: 16px; }
    .msg-actions { display: flex; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
    .action-btn { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border: none; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: background .15s; }
    .approve-btn { background: var(--success); color: #fff; }
    .approve-btn:hover { background: #15803d; }
    .reject-btn { background: #f3f4f6; color: var(--text-muted); border: 1px solid var(--border); }
    .reject-btn:hover { background: #e5e7eb; color: var(--text); }
    .action-status { font-size: 11px; font-weight: 600; }
    .action-status.success { color: var(--success); }
    .action-status.error { color: var(--error); }
    .action-status.dismissed { color: var(--dismissed); }
    .input-area { flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 10px 12px 8px; }
    .input-row { display: flex; gap: 8px; align-items: flex-end; }
    .input-row textarea { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 12px; color: var(--text); background: var(--bg); resize: none; min-height: 36px; max-height: 80px; line-height: 1.4; }
    .input-row textarea:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 2px rgba(26,58,92,.1); }
    .send-btn { width: 36px; height: 36px; border: none; border-radius: 8px; background: var(--primary); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .send-btn:hover:not(:disabled) { background: var(--primary-light); }
    .send-btn:disabled { opacity: .4; cursor: not-allowed; }
    .send-btn.loading { position: relative; }
    .send-btn.loading::after { content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
    .send-btn.loading svg { visibility: hidden; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .input-hints { display: flex; gap: 6px; margin-top: 6px; }
    .hint-select { flex: 1; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; font-size: 10px; color: var(--text-muted); background: var(--bg); }
    .settings-footer { flex-shrink: 0; text-align: center; padding: 4px; background: var(--surface); border-top: 1px solid var(--border); }
    .settings-link { background: none; border: none; font-size: 10px; color: var(--text-muted); cursor: pointer; text-decoration: underline; }
    .settings-link:hover { color: var(--primary); }
    .settings-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .settings-card { background: var(--surface); border-radius: 12px; padding: 20px; width: 90%; max-width: 320px; box-shadow: 0 8px 32px rgba(0,0,0,.15); display: flex; flex-direction: column; gap: 10px; }
    .settings-card-header { display: flex; justify-content: space-between; align-items: center; }
    .settings-card h2 { font-size: 14px; font-weight: 700; color: var(--primary); }
    .settings-card label { font-size: 11px; font-weight: 600; }
    .settings-card input, .settings-card select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; background: var(--bg); }
    .settings-card input:focus, .settings-card select:focus { outline: none; border-color: var(--primary-light); }
    .key-input-wrapper { display: flex; gap: 6px; }
    .key-input-wrapper input { flex: 1; }
    .icon-btn-sm { background: none; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; padding: 2px 6px; font-size: 12px; color: var(--text-muted); }
    .icon-btn-sm:hover { background: var(--bg); color: var(--text); }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-row { display: flex; gap: 8px; margin-top: 4px; }
    .status-msg { font-size: 11px; margin-top: 4px; }
    .status-msg.success { color: var(--success); }
    .status-msg.error { color: var(--error); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app">
  <header class="header">
    <h1 class="logo">AI<span class="logo-colon">:</span>ssociate</h1>
    <p class="subtitle">Legal AI Assistant</p>
  </header>

  <div class="selection-bar">
    <div class="selection-bar-header">
      <span class="selection-label">Selected Text</span>
      <button id="grab-selection-btn" class="icon-btn-sm" title="Refresh selection">&#8635;</button>
    </div>
    <div id="selection-preview" class="selection-preview">
      <p class="placeholder">Highlight text in your document to get started.</p>
    </div>
  </div>

  <div id="chat-container" class="chat-container">
    <div id="chat-messages" class="chat-messages">
      <div class="chat-welcome">
        <p>Select text in Word, then ask a question or request a suggestion.</p>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="question-input" rows="2" placeholder="Ask about the selected text or request changes..."></textarea>
      <button id="send-btn" class="send-btn" disabled title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="input-hints">
      <select id="legal-area-select" class="hint-select" title="Legal area">
        <option value="">Any area</option>
        <option value="zivilrechtogh">Civil</option>
        <option value="strafrecht">Criminal</option>
        <option value="steuerrecht">Tax</option>
        <option value="publiclaw">Public</option>
      </select>
      <select id="scope-select" class="hint-select" title="Jurisdiction scope">
        <option value="">Any scope</option>
        <option value="Bund">Bund</option>
        <option value="Wien">Wien</option>
        <option value="Steiermark">Steiermark</option>
        <option value="Tirol">Tirol</option>
        <option value="Kärnten">Kaernten</option>
        <option value="Niederösterreich">Niederoesterreich</option>
        <option value="Oberösterreich">Oberoesterreich</option>
        <option value="Vorarlberg">Vorarlberg</option>
        <option value="Burgenland">Burgenland</option>
        <option value="Salzburg">Salzburg</option>
      </select>
    </div>
  </div>

  <div class="settings-footer">
    <button id="settings-toggle" class="settings-link">Settings</button>
  </div>

  <div id="settings-overlay" class="settings-overlay hidden">
    <div class="settings-card">
      <div class="settings-card-header">
        <h2>Settings</h2>
        <button id="settings-close" class="icon-btn-sm">&times;</button>
      </div>
      <label for="api-key-input">API Key</label>
      <div class="key-input-wrapper">
        <input id="api-key-input" type="password" placeholder="ck:..." />
        <button id="toggle-key-vis" class="icon-btn-sm" title="Show/hide">&#128065;</button>
      </div>
      <label for="language-select">Response Language</label>
      <select id="language-select">
        <option value="auto">Auto-detect</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="fr">Francais</option>
      </select>
      <div class="btn-row">
        <button id="save-settings" class="btn btn-primary">Save</button>
      </div>
      <p id="settings-status" class="status-msg hidden"></p>
    </div>
  </div>
</div>

<script>
/* global Office, Word */
(function () {
  "use strict";

  const AISSOCIATE_BASE_URL = "https://aissociate.at";
  const AISSOCIATE_ASK_ENDPOINT = "/api/public/v1/chat/ask";
  const DEFAULT_API_KEY = "ck:2a4fb1fc-fdd8-477d-b353-602573944fdb:46a20ebd-abad-4a7d-b1ed-ec4ab8a535ac";

  let currentSelection = "";
  let threadId = null;
  let isStreaming = false;

  const $ = (id) => document.getElementById(id);

  Office.onReady(({ host }) => {
    if (host === Office.HostType.Word) {
      loadSettings();
      bindEvents();
      refreshSelection();
    }
  });

  function loadSettings() {
    $("api-key-input").value = localStorage.getItem("aissociate_api_key") || DEFAULT_API_KEY;
    $("language-select").value = localStorage.getItem("aissociate_language") || "auto";
  }

  function saveSettings() {
    const key = $("api-key-input").value.trim() || DEFAULT_API_KEY;
    localStorage.setItem("aissociate_api_key", key);
    localStorage.setItem("aissociate_language", $("language-select").value);
    showStatus("settings-status", "Saved!", "success");
    $("settings-overlay").classList.add("hidden");
    updateSendButton();
  }

  function getApiKey() {
    return localStorage.getItem("aissociate_api_key") || DEFAULT_API_KEY;
  }

  function bindEvents() {
    $("settings-toggle").addEventListener("click", () => $("settings-overlay").classList.remove("hidden"));
    $("settings-close").addEventListener("click", () => $("settings-overlay").classList.add("hidden"));
    $("save-settings").addEventListener("click", saveSettings);
    $("toggle-key-vis").addEventListener("click", () => {
      $("api-key-input").type = $("api-key-input").type === "password" ? "text" : "password";
    });
    $("grab-selection-btn").addEventListener("click", refreshSelection);
    $("question-input").addEventListener("input", updateSendButton);
    $("question-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    $("send-btn").addEventListener("click", sendMessage);
  }

  async function refreshSelection() {
    try {
      await Word.run(async (ctx) => {
        const sel = ctx.document.getSelection();
        sel.load("text");
        await ctx.sync();
        currentSelection = sel.text.trim();
        const preview = $("selection-preview");
        if (currentSelection) {
          const t = currentSelection.length > 300 ? currentSelection.substring(0, 300) + "..." : currentSelection;
          preview.innerHTML = '<div class="selected-text">' + esc(t) + '</div>';
        } else {
          preview.innerHTML = '<p class="placeholder">Highlight text in your document to get started.</p>';
        }
        updateSendButton();
      });
    } catch {
      $("selection-preview").innerHTML = '<p class="placeholder">Could not read selection.</p>';
    }
  }

  async function sendMessage() {
    if (isStreaming) return;
    const question = $("question-input").value.trim();
    if (!question) return;
    await refreshSelection();

    const legalArea = $("legal-area-select").value || null;
    const scope = $("scope-select").value || null;
    const language = localStorage.getItem("aissociate_language") || "auto";

    let fullQuestion = question;
    if (currentSelection) {
      const langNote = language !== "auto" ? " Please respond in " + ({en:"English",de:"German",fr:"French"})[language] + "." : "";
      fullQuestion = 'Regarding this legal text:\n"""\n' + currentSelection + '\n"""\n\n' + question + langNote;
    }

    addChatMessage("user", question);
    $("question-input").value = "";
    updateSendButton();

    const bubble = addChatMessage("assistant", "");
    const contentEl = bubble.querySelector(".msg-text");
    const actionsEl = bubble.querySelector(".msg-actions");

    isStreaming = true;
    setSendLoading(true);

    let fullResponse = "";

    try {
      const body = {
        question: fullQuestion,
        law: legalArea || null,
        sub_law: scope || null,
        file_context: [],
        file_query_type: "general"
      };
      if (threadId) body.thread_id = threadId;

      const response = await fetch(AISSOCIATE_BASE_URL + AISSOCIATE_ASK_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-api-key": getApiKey() },
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        const errText = await response.text().catch(() => "");
        throw new Error("HTTP " + response.status + ": " + (errText || "Request failed"));
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";

        let currentEventType = "message";
        for (const line of lines) {
          if (line.startsWith("event: ")) {
            currentEventType = line.slice(7).trim();
            continue;
          }
          if (line.startsWith("data: ")) {
            const dataStr = line.slice(6).trim();
            if (dataStr === "[DONE]") continue;
            try {
              const data = JSON.parse(dataStr);
              if (currentEventType === "error") throw new Error(data.text || "API error");
              if (data.type === "qa_metadata" && data.meta?.qa_metadata?.thread_id) {
                threadId = data.meta.qa_metadata.thread_id;
              }
              if (data.type === "message" && data.text) {
                fullResponse += data.text;
                contentEl.textContent = fullResponse;
                scrollChatToBottom();
              }
            } catch (pe) {
              if (currentEventType === "error") throw pe;
            }
            currentEventType = "message";
          }
        }
      }

      if (!fullResponse && buffer) {
        try {
          const data = JSON.parse(buffer);
          fullResponse = data.text || buffer;
        } catch { fullResponse = buffer; }
        contentEl.textContent = fullResponse;
      }

      if (!fullResponse) {
        contentEl.textContent = "No response received.";
      } else {
        actionsEl.classList.remove("hidden");
        setupActions(actionsEl, fullResponse);
      }
    } catch (err) {
      contentEl.textContent = "Error: " + err.message;
      bubble.classList.add("msg-error");
    } finally {
      isStreaming = false;
      setSendLoading(false);
      scrollChatToBottom();
    }
  }

  function addChatMessage(role, text) {
    const messages = $("chat-messages");
    const welcome = messages.querySelector(".chat-welcome");
    if (welcome) welcome.remove();

    const bubble = document.createElement("div");
    bubble.className = "msg msg-" + role;

    if (role === "user") {
      bubble.innerHTML = '<div class="msg-content"><div class="msg-text">' + esc(text) + '</div></div>';
    } else {
      bubble.innerHTML =
        '<div class="msg-content">' +
          '<div class="msg-label">AI:ssociate</div>' +
          '<div class="msg-text">' + esc(text) + '</div>' +
          '<div class="msg-actions hidden">' +
            '<button class="action-btn approve-btn" title="Apply suggestion to document">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Apply' +
            '</button>' +
            '<button class="action-btn reject-btn" title="Dismiss suggestion">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> Dismiss' +
            '</button>' +
          '</div>' +
        '</div>';
    }

    messages.appendChild(bubble);
    scrollChatToBottom();
    return bubble;
  }

  function setupActions(actionsEl, responseText) {
    actionsEl.querySelector(".approve-btn").addEventListener("click", async () => {
      try {
        await applyToDocument(responseText);
        actionsEl.innerHTML = '<span class="action-status success">Applied to document</span>';
      } catch (err) {
        actionsEl.innerHTML = '<span class="action-status error">Failed: ' + esc(err.message) + '</span>';
      }
    });
    actionsEl.querySelector(".reject-btn").addEventListener("click", () => {
      actionsEl.innerHTML = '<span class="action-status dismissed">Dismissed</span>';
    });
  }

  async function applyToDocument(text) {
    await Word.run(async (ctx) => {
      const sel = ctx.document.getSelection();
      sel.load("text");
      await ctx.sync();
      sel.insertText(text, Word.InsertLocation.replace);
      await ctx.sync();
    });
    await refreshSelection();
  }

  function scrollChatToBottom() {
    const c = $("chat-messages");
    c.scrollTop = c.scrollHeight;
  }

  function updateSendButton() {
    $("send-btn").disabled = !$("question-input").value.trim() || isStreaming;
  }

  function setSendLoading(on) {
    $("send-btn").disabled = on;
    $("question-input").disabled = on;
    $("send-btn").classList.toggle("loading", on);
  }

  function showStatus(id, msg, type) {
    const el = $(id);
    el.textContent = msg;
    el.className = "status-msg " + type;
    el.classList.remove("hidden");
    setTimeout(() => el.classList.add("hidden"), 4000);
  }

  function esc(str) {
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }
})();
</script>
</body>
</html>
