services:
  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      - RIS_API_BASE_URL=https://data.bka.gv.at/ris/api/v2.6
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
