services:

  # ================================================================
  # OpenClaw — AI-Agent (GPT-4o), erreichbar über WhatsApp + Web UI
  # ================================================================
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-sandbox
    ports:
      - "18789:18789"           # Web UI + Gateway
    volumes:
      - ./openclaw-data:/home/node/.openclaw
      - openclaw-plugins:/home/node/.openclaw/plugin-runtime-deps
      - ./workspace:/home/node/.openclaw/workspace
    env_file:
      - .env
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - openclaw-net

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18789/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ================================================================
  # Bridge — Holt Emails (IMAP), empfängt Teams (Webhook),
  #          sendet Entwürfe aus outbox/ per SMTP / Teams-Webhook
  # ================================================================
  bridge:
    build: ./bridge
    container_name: openclaw-bridge
    ports:
      - "8080:8080"             # Teams-Webhook-Endpunkt
    volumes:
      - ./workspace:/workspace  # Shared workspace mit OpenClaw
    env_file:
      - .env
    environment:
      - WORKSPACE_DIR=/workspace
      - POLL_INTERVAL_SECONDS=30
    restart: unless-stopped

    # --- Sandbox-Härtung ---
    read_only: true
    tmpfs:
      - /tmp:size=50M,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - openclaw-net

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  openclaw-plugins:

networks:
  openclaw-net:
    driver: bridge
