# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aissociate-playground
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # set the value in the Render dashboard
      - key: E2B_API_KEY
        sync: false   # set the value in the Render dashboard
      - key: OPENAI_MODEL_FAST
        value: gpt-6-luna
      - key: OPENAI_MODEL_MAIN
        value: gpt-6-sol
      - key: ROUTING
        value: auto
