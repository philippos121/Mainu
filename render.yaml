# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aissociate-playground
    runtime: docker
    plan: starter   # a persistent disk needs a paid instance
    healthCheckPath: /api/health
    envVars:
      - key: AZURE_OPENAI_API_KEY
        sync: false   # set in the Render dashboard; when set, every model call goes to Azure OpenAI (one deployment)
      - key: AZURE_OPENAI_ENDPOINT
        value: https://aissociate-evaluation-azure-openai-ressource.openai.azure.com
      - key: AZURE_OPENAI_DEPLOYMENT
        value: gpt-6.1-terra
      - key: AZURE_OPENAI_DD_DEPLOYMENT
        value: gpt-6.1-sol   # due diligence only (region global)
      - key: OPENAI_API_KEY
        sync: false   # only used without AZURE_OPENAI_API_KEY
      - key: E2B_API_KEY
        sync: false   # set the value in the Render dashboard
      - key: AISSOCIATE_API_KEY
        sync: false   # set the value in the Render dashboard
      - key: OPENAI_MODEL_MAIN
        value: gpt-6-sol
      - key: DATA_DIR
        value: /data
      - key: AUTH_SECRET
        generateValue: true   # signs the session cookies (else a key stored on the disk is used)
      # - key: AUTH_ALLOWED_DOMAINS   # self-registration for these e-mail domains, e.g. kanzlei.at
      #   value: kanzlei.at
    # Accounts, Akten, Skills and conversations live in DATA_DIR on this disk and
    # survive deploys. (A disk at /data is also picked up without DATA_DIR.)
    disk:
      name: aissociate-data
      mountPath: /data
      sizeGB: 10
