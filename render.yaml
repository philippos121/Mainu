# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aissociate-playground
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AZURE_OPENAI_API_KEY
        sync: false   # set in the Render dashboard; when set, every model call goes to Azure OpenAI (one deployment)
      - key: AZURE_OPENAI_ENDPOINT
        value: https://aissociate-evaluation-azure-openai-ressource.openai.azure.com
      - key: AZURE_OPENAI_DEPLOYMENT
        value: gpt-6.1-terra
      - key: OPENAI_API_KEY
        sync: false   # only used without AZURE_OPENAI_API_KEY
      - key: E2B_API_KEY
        sync: false   # set the value in the Render dashboard
      - key: AISSOCIATE_API_KEY
        sync: false   # set the value in the Render dashboard
      - key: OPENAI_MODEL_MAIN
        value: gpt-6-sol
      - key: DATA_DIR
        value: /data
    # Matters (Akten) and due-diligence results live in DATA_DIR. Uncomment the
    # disk (paid plans) so they survive deploys; without it they are ephemeral.
    # disk:
    #   name: aissociate-data
    #   mountPath: /data
    #   sizeGB: 10
